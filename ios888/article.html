document.addEventListener("DOMContentLoaded", function() {
    const params = new URLSearchParams(window.location.search);
    const articleId = params.get('id');
    const container = document.getElementById('articleContainer');

    if (!articleId || !articles[articleId]) {
        container.innerHTML = `
            <div class="error-box">
                <p style="font-size: 3rem; margin-bottom: 20px;">📭</p>
                <h2 style="margin-bottom: 10px; color: #333;">文章未找到</h2>
                <p style="color: #888;">该文章不存在或已被删除</p>
                <a href="index.html" style="display: inline-block; margin-top: 20px; padding: 12px 30px; background: linear-gradient(135deg, #8B5CF6, #0EA5E9); color: white; border-radius: 8px; text-decoration: none; font-weight: 600;">返回首页</a>
            </div>`;
        document.querySelector('footer').style.display = 'block';
        return;
    }

    const article = articles[articleId];
    const otherIds = Object.keys(articles).filter(id => id !== articleId);

    document.title = article.title + '-苹果马甲包';

    container.innerHTML = `
        <div class="breadcrumb">
            <a href="index.html">首页</a> &raquo; 
            <a href="index.html#news">上架资讯</a> &raquo; 
            <span>${article.title.substring(0, 30)}...</span>
        </div>

        <h1>${article.title}</h1>

        <div class="meta">
            <span>📅 ${article.date}</span>
            <span style="margin-left: 15px;">👁️ 阅读 ${article.views}</span>
        </div>

        <img src="uploads/placeholder.svg" alt="${article.title}" class="cover" loading="lazy">

        <div class="article-body">
            ${article.content}
        </div>

        <div class="related-articles">
            <h3>相关文章</h3>
            <ul class="related-list">
                ${otherIds.map(id => {
                    const a = articles[id];
                    return `<li><a href="article.html?id=${id}">${a.title.substring(0, 50)}...</a></li>`;
                }).join('')}
            </ul>
        </div>
    `;

    const content = document.querySelector('.article-body');
    if (content) {
        content.querySelectorAll('img').forEach(img => {
            img.setAttribute('loading', 'lazy');
        });
        content.querySelectorAll('a[href^="http"]').forEach(a => {
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
        });
    }
});
